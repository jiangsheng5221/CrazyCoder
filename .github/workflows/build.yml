# GitHub Actions 流水线模板。复制到新项目 .github/workflows/build.yml
# 然后把 env 段里的 APP_NAME / BUNDLE_ID / PROFILE_NAME 改成你自己的。

name: Build iOS

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_type:
        description: '0 = 开发包 / 1 = AdHoc 内测 / 2 = 正式发布'
        required: true
        default: '2'
      upload_testflight:
        description: '上传到 TestFlight (true/false)'
        required: false
        default: 'false'

# 同一分支/标签只保留一次构建，新触发自动取消旧的
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # ===== 只需要改这三行 =====
  APP_NAME: CrazyCoder                     # 必须和 project.yml 的 name、scheme 一致
  BUNDLE_ID: com.crazycoder.app            # 必须和 project.yml 里的 PRODUCT_BUNDLE_IDENTIFIER 一致
  PROFILE_NAME: CrazyCoder AppStore        # 描述文件在 Apple 后台显示的名字（App Store 类型）
  # =========================

jobs:
  build:
    name: Build on macOS
    runs-on: macos-15
    # 卡住时最多烧 45 分钟，绝不允许跑满默认 6 小时
    timeout-minutes: 45
    env:
      CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # tag 触发一律出正式包：AdHoc 包上传 TestFlight 必被拒
      - name: Resolve build params
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            MV="${GITHUB_REF_NAME#v}"
            BT="2"
          else
            MV=""
            BT="${{ github.event.inputs.build_type || '2' }}"
          fi
          echo "MARKETING_VERSION=$MV" >> $GITHUB_ENV
          echo "BUILD_TYPE=$BT" >> $GITHUB_ENV
          {
            echo "### 构建参数"
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 版本号 | ${MV:-（取 project.yml）} |"
            echo "| 构建号 | $GITHUB_RUN_NUMBER |"
            echo "| 类型 | $BT (0=dev / 1=AdHoc / 2=正式) |"
            echo "| 触发 | $GITHUB_REF |"
          } >> $GITHUB_STEP_SUMMARY

      - name: Select Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$LATEST" ] && LATEST=/Applications/Xcode.app
          sudo xcode-select -s "$LATEST"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      # 用 xcodegen 现场生成 .xcodeproj，避免 pbxproj 冲突
      # 注意：预编译包解压层级不固定，必须用 find 定位；定位不到就回退 brew
      - name: Generate Xcode project
        run: |
          set -e
          XCODEGEN_BIN=$(command -v xcodegen || true)
          if [ -z "$XCODEGEN_BIN" ]; then
            if curl -fsSL --retry 3 --max-time 150 -o /tmp/xcodegen.zip \
                https://github.com/yonaskolb/XcodeGen/releases/download/2.42.0/xcodegen.zip \
               && unzip -o -q /tmp/xcodegen.zip -d /tmp/xcg; then
              XCG=$(find /tmp/xcg -type f -name xcodegen | head -1)
              if [ -n "$XCG" ]; then
                # 保留 bin/ 与 share/ 结构：xcodegen 要读 share/xcodegen/SettingPresets
                XCG_ROOT=$(cd "$(dirname "$XCG")/.." && pwd)
                sudo cp -R "$XCG_ROOT"/. /usr/local/
                sudo chmod +x /usr/local/bin/xcodegen
                sudo xattr -dr com.apple.quarantine /usr/local/bin/xcodegen 2>/dev/null || true
                XCODEGEN_BIN=/usr/local/bin/xcodegen
              fi
            fi
            if [ -z "$XCODEGEN_BIN" ]; then
              echo "预编译包不可用，回退 brew"
              brew install xcodegen
              XCODEGEN_BIN=$(command -v xcodegen)
            fi
          fi
          "$XCODEGEN_BIN" --version
          "$XCODEGEN_BIN" generate
          [ -d "${APP_NAME}.xcodeproj" ] || { echo "xcodeproj 未生成"; exit 1; }

      - name: Import certificate
        run: |
          printf '%s' "$CERTIFICATE_BASE64" | tr -d '\n\r ' | base64 --decode > certificate.p12
          echo "p12 size: $(wc -c < certificate.p12) bytes"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain -P "$P12_PASSWORD" -A \
            -T /usr/bin/codesign -T /usr/bin/security -f openssl
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychain -d user -s build.keychain login.keychain-db
          security find-identity -v build.keychain || true

      - name: Install provisioning profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          OUT=~/Library/MobileDevice/Provisioning\ Profiles/${APP_NAME}.mobileprovision
          printf '%s' "$PROVISIONING_PROFILE" | tr -d '\n\r ' | base64 --decode > "$OUT"
          security cms -D -i "$OUT" > /tmp/profile.plist
          /usr/libexec/PlistBuddy -c "Print :UUID" /tmp/profile.plist
          /usr/libexec/PlistBuddy -c "Print :Name" /tmp/profile.plist

      - name: Build Archive
        run: |
          METHOD="development"; PROFILE="${PROFILE_NAME} Development"
          if [ "$BUILD_TYPE" = "1" ]; then METHOD="ad-hoc"; PROFILE="${PROFILE_NAME} AdHoc"; fi
          if [ "$BUILD_TYPE" = "2" ]; then METHOD="app-store"; PROFILE="${PROFILE_NAME}"; fi
          echo "method=$METHOD profile=$PROFILE"
          set -o pipefail
          xcodebuild -project "${APP_NAME}.xcodeproj" -scheme "${APP_NAME}" \
            -configuration Release \
            -archivePath "build/${APP_NAME}.xcarchive" \
            -destination "generic/platform=iOS" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE" \
            CODE_SIGNING_REQUIRED=YES CODE_SIGNING_ALLOWED=YES \
            ${MARKETING_VERSION:+MARKETING_VERSION=$MARKETING_VERSION} \
            CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER \
            clean archive 2>&1 | tee /tmp/build.log | grep -E "error:|warning:|BUILD|\*\*" || true
          if ! grep -qE "BUILD SUCCEEDED|ARCHIVE SUCCEEDED" /tmp/build.log; then
            echo "=== 构建失败，最后 60 行 ==="
            tail -60 /tmp/build.log
            exit 1
          fi

      - name: Export IPA
        run: |
          METHOD="development"
          if [ "$BUILD_TYPE" = "1" ]; then METHOD="ad-hoc"; fi
          if [ "$BUILD_TYPE" = "2" ]; then METHOD="app-store"; fi
          PROFILE="${PROFILE_NAME} Development"
          if [ "$BUILD_TYPE" = "1" ]; then PROFILE="${PROFILE_NAME} AdHoc"; fi
          if [ "$BUILD_TYPE" = "2" ]; then PROFILE="${PROFILE_NAME}"; fi
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>${METHOD}</string>
            <key>teamID</key><string>${DEVELOPMENT_TEAM}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key><string>${PROFILE}</string>
            </dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          plutil -lint ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath "build/${APP_NAME}.xcarchive" \
            -exportPath build/ipa \
            -exportOptionsPlist ExportOptions.plist 2>&1 | tee /tmp/export.log || exit 1
          ls -la build/ipa

      - name: Package
        run: |
          cd build/ipa
          for f in *.ipa; do cp "$f" "../${APP_NAME}.ipa"; done
          cd ../..
          cp ExportOptions.plist build/ || true

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-ipa
          path: build/${{ env.APP_NAME }}.ipa

      # dSYM 是崩溃日志符号化的唯一凭据，务必保留
      - name: Upload dSYM
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-dsym
          path: build/${{ env.APP_NAME }}.xcarchive/dSYMs
          if-no-files-found: warn

      # ===== 可选：上传 TestFlight =====
      # 需要 Secrets: ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8（.p8 的内容）
      # 只有在正式包（type=2）时才允许上传，AdHoc 包必被拒
      - name: Upload to TestFlight
        if: env.BUILD_TYPE == '2' && (github.event.inputs.upload_testflight == 'true' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          if grep -qE "<string>(ad-hoc|development)</string>" ExportOptions.plist; then
            echo "包类型不是正式包，拒绝上传 TestFlight"
            exit 1
          fi
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "${{ secrets.ASC_KEY_P8 }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          xcrun altool --upload-app \
            -f "build/${APP_NAME}.ipa" -t ios \
            --apiKey "${{ secrets.ASC_KEY_ID }}" \
            --apiIssuer "${{ secrets.ASC_ISSUER_ID }}"

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain build.keychain 2>/dev/null || true
          rm -f certificate.p12
